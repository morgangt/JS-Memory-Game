<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Game - Telegram Mini App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container" id="gameContainer">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="material-icons-round logo-icon">psychology</span>
                <span class="logo-text">Memory</span>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="material-icons-round stat-icon">timer</span>
                <span class="stat-value" id="timer">30</span>
            </div>
            <div class="stat-item">
                <span class="material-icons-round stat-icon">touch_app</span>
                <span class="stat-value" id="moves">0</span>
            </div>
        </div>

        <!-- Difficulty Selector -->
        <div class="difficulty-selector">
            <button class="difficulty-btn active" data-difficulty="easy">EASY</button>
            <button class="difficulty-btn" data-difficulty="normal">NORM</button>
            <button class="difficulty-btn" data-difficulty="hard">HARD</button>
            <button class="restart-btn" id="restartBtn">
                <span class="material-icons-round">refresh</span>
            </button>
        </div>

        <!-- Game Board -->
        <div class="game-board" id="gameBoard">
            <!-- Cards will be generated by JS -->
        </div>

        <!-- Card Template (hidden) -->
        <template id="cardTemplate">
            <div class="card" data-index="">
                <div class="card-inner">
                    <div class="card-front">
                        <div class="card-pattern">
                            <span class="material-icons-round">help_outline</span>
                        </div>
                    </div>
                    <div class="card-back">
                        <span class="card-icon"></span>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-icon" id="modalIcon"></div>
            <h2 class="modal-title" id="modalTitle">Поздравляем!</h2>
            <p class="modal-subtitle" id="modalSubtitle">Вы нашли все пары!</p>
            
            <div class="modal-stats" id="modalStats">
                <div class="modal-stat">
                    <span class="material-icons-round">timer</span>
                    <span id="finalTime">00:00</span>
                </div>
                <div class="modal-stat">
                    <span class="material-icons-round">touch_app</span>
                    <span id="finalMoves">0</span> ходов
                </div>
            </div>

            <div class="modal-record" id="modalRecord">
                <span class="material-icons-round">emoji_events</span>
                <span>Новый рекорд!</span>
            </div>

            <button class="modal-btn" id="modalBtn">ИГРАТЬ СНОВА</button>
        </div>
    </div>

    <!-- Confetti Container -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="game.js"></script>
</body>
</html>
